<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may claim the well-known daemon name. -->
  <policy user="root">
    <allow own="io.github.aoruslinux.Control1"/>
  </policy>

  <!-- The daemon performs polkit checks for every mutating method. -->
  <policy context="default">
    <allow send_destination="io.github.aoruslinux.Control1"
           send_interface="io.github.aoruslinux.Control1"/>
    <allow send_destination="io.github.aoruslinux.Control1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.aoruslinux.Control1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow receive_sender="io.github.aoruslinux.Control1"/>
  </policy>
</busconfig>

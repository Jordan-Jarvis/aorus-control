[package]
name = "aorus-control"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Native Linux controls for supported GIGABYTE AERO/AORUS laptops"
repository = "https://github.com/Jordan-Jarvis/aorus-control"
readme = "README.md"
keywords = ["aorus", "gigabyte", "fan-control", "linux"]
categories = ["hardware-support"]
publish = false

[features]
default = ["ui"]
ui = ["dep:eframe", "dep:egui_plot", "dep:ksni", "dep:winit"]

[dependencies]
eframe = { version = "0.36.1", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_plot = { version = "0.37.0", optional = true }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"], optional = true }
libc = "0.2.177"
winit = { version = "0.30", optional = true, default-features = false, features = ["x11"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
zbus = { version = "5.19.0", default-features = true }

[[bin]]
name = "aorus-control"
path = "src/bin/aorus-control.rs"
required-features = ["ui"]

[[bin]]
name = "aorusctl"
path = "src/bin/aorusctl.rs"

[[bin]]
name = "aorusd"
path = "src/bin/aorusd.rs"

name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Build Ubuntu 24.04 packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang git libbpf-dev libelf-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build application and native HID support
        run: |
          cargo test --all-features
      - name: Build packages
        run: |
          ./tools/build-deb.sh dist
          (cd dist && sha256sum -- *.deb > SHA256SUMS)
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
          fi
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aorus-control-${{ github.ref_name }}
          path: dist/
